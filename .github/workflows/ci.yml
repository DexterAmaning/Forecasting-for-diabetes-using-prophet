name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (network blocked)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run tests with outbound network access blocked
        env:
          PYTHONPATH: .github/ci
        run: python -m pytest -p no:cacheprovider -p nonet -rA

  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install pyflakes==3.2.0
      - name: Pyflakes (undefined names, unused imports, syntax errors)
        run: python -m pyflakes $(git ls-files '*.py')
      - name: Every Python file compiles
        run: python -m compileall -q $(git ls-files '*.py')

  notebook:
    name: Notebook re-executes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Execute the notebook top to bottom (output kept out of the repository)
        run: >-
          python -m jupyter nbconvert --to notebook --execute
          --ExecutePreprocessor.timeout=1500
          --output-dir "$RUNNER_TEMP" notebooks/medicaid_diabetes_spending.ipynb
